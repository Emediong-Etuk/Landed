[workspace]
members = ["programs/landed", "programs/naive-cashout", "crates/landed-core"]
exclude = ["tests/magicsvm"]
resolver = "2"

[profile.release]
overflow-checks = true
lto = "fat"
codegen-units = 1

[profile.release.build-override]
opt-level = 3
incremental = false
codegen-units = 1

# Smaller binaries = cheaper deploys (rent is per byte).
[profile.release.package.landed]
opt-level = "s"
[profile.release.package.naive-cashout]
opt-level = "s"
[profile.release.package."*"]
opt-level = "s"
