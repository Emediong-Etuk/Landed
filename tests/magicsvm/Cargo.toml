[package]
name = "landed-magicsvm-tests"
version = "0.1.0"
edition = "2021"
publish = false

[workspace]

[dev-dependencies]
anchor-lang = "=1.0.2"
anchor-spl = { version = "=1.0.2", features = ["token", "associated_token"] }
ephemeral-rollups-sdk = { version = "=0.18.0", features = ["anchor", "vrf"] }
landed = { path = "../../programs/landed", features = ["no-entrypoint", "fault-lab", "short-timers", "sim-committor-drop"] }
naive-cashout = { path = "../../programs/naive-cashout", features = ["no-entrypoint"] }
landed-core = { path = "../../crates/landed-core" }
session-keys = { version = "=3.1.1", features = ["no-entrypoint"] }
magicsvm = "0.3.0"
solana-address = "~2.6.1"
solana-hash = "~4.5.0"
solana-instruction = { version = "~3.4.0", features = ["bincode"] }
solana-keypair = "3.1.2"
solana-message = "4.2.4"
solana-native-token = "3.0.0"
solana-signer = "3.0.1"
solana-transaction = { version = "4.1.5", features = ["verify"] }
solana-transaction-error = "~3.3.1"
solana-account = "4.3.1"
solana-clock = { version = "=3.1.1", features = ["sysvar", "wincode"] }
serde_json = "1"
bytemuck = "1"
